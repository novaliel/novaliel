<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novaliel | Em breve</title>
  <meta name="description" content="O site da Novaliel está sendo construído. Fale com a gente pelo e-mail.">

  <!-- Ícone da aba: uma estrela desenhada em SVG, sem precisar de arquivo de imagem -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23151A3C'/><circle cx='16' cy='16' r='5' fill='%23FFF3CF'/></svg>">

  <!-- Fonte: Bricolage Grotesque, do Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap" rel="stylesheet">

  <style>
    /* Cores do site. Mude aqui e o site inteiro muda junto. */
    :root {
      --noite: #151A3C;        /* fundo: céu de noite */
      --horizonte: #343A74;    /* azul mais claro, perto do horizonte */
      --aurora: #F4C9A4;       /* luz do amanhecer */
      --estrela: #FFF3CF;      /* brilho da estrela */
      --texto: #E9EAF6;        /* texto principal */
      --texto-suave: #A7ADD6;  /* texto secundário */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: clamp(24px, 6vw, 72px);
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      color: var(--texto);
      background-color: var(--noite);
      /* Céu de madrugada: escuro em cima, clareando embaixo */
      background-image:
        radial-gradient(120% 55% at 50% 118%, rgba(244, 201, 164, 0.32), transparent 62%),
        linear-gradient(to bottom, var(--noite) 40%, var(--horizonte) 100%);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 44rem;
    }

    /* O nome da marca, bem grande */
    .marca {
      font-size: clamp(3.5rem, 15vw, 9.5rem);
      font-weight: 300;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    /* O "i" sem pingo: o pingo é a estrela */
    .i { position: relative; }

    .estrela {
      position: absolute;
      left: 50%;
      top: 0.12em;
      width: 0.11em;
      height: 0.11em;
      border-radius: 50%;
      background: var(--estrela);
      box-shadow:
        0 0 0.06em var(--estrela),
        0 0 0.3em rgba(255, 243, 207, 0.5);
      transform: translateX(-50%);
      animation: nova 2.2s ease-out 0.3s both;
    }

    /* A estrela "acende" uma vez quando a página abre */
    @keyframes nova {
      0%   { opacity: 0; transform: translateX(-50%) scale(0.2); }
      50%  { opacity: 1; transform: translateX(-50%) scale(1.7); }
      100% { opacity: 1; transform: translateX(-50%) scale(1); }
    }

    .aviso {
      margin-top: clamp(20px, 3vw, 32px);
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .contato {
      margin-top: 12px;
      max-width: 34ch;
      font-size: 1.0625rem;
      line-height: 1.55;
      color: var(--texto-suave);
    }

    a {
      color: var(--estrela);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
    }
    a:hover { color: var(--aurora); }
    a:focus-visible {
      outline: 2px solid var(--aurora);
      outline-offset: 3px;
      border-radius: 2px;
    }

    footer {
      font-size: 0.875rem;
      color: var(--texto-suave);
    }

    /* Para quem prefere menos movimento na tela */
    @media (prefers-reduced-motion: reduce) {
      .estrela { animation: none; }
    }
  </style>
</head>
<body>

  <main>
    <h1 class="marca" aria-label="Novaliel">
      <span aria-hidden="true">noval<span class="i">ı<span class="estrela"></span></span>el</span>
    </h1>

    <p class="aviso">Em breve.</p>

    <p class="contato">
      Enquanto o site não fica pronto, fale com a gente em
      <a href="mailto:contato@novaliel.com">gabrielaurelio@novaliel.com</a>
    </p>
  </main>

  <footer>© 2026 Novaliel</footer>

</body>
</html>
